name: secret-scan

# gitleaks over the ENTIRE history, not just the diff: this repo is a copy of two
# live hosts, so an old commit is as dangerous as a new one, and a secret pushed
# in a branch that was later force-pushed still lives in the object store.
# `fetch-depth: 0` is what makes that possible — the default shallow clone would
# scan a single commit and report nothing forever.
#
# .gitleaks.toml extends the default rule set and allowlists the *paths* that
# SECRETS.md already documents as part of the snapshot. A finding anywhere else
# fails this job; that is the whole point, so do not add your file to the list.
#
# The binary is pinned to CLI 8.30.1 and its release tarball is verified against
# the sha256 from the project's published checksums file
# (gitleaks_8.30.1_checksums.txt), so a tampered or swapped asset cannot run.
# Nothing here needs a licence key: gitleaks is MIT.
#
# `--redact` matters: the log of a failing run is visible in the Actions tab and
# to anyone with read access, so the finding is reported by file/line/rule only.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: '8.30.1'
  # sha256 of gitleaks_8.30.1_linux_x64.tar.gz
  GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'

jobs:
  gitleaks:
    name: gitleaks 8.30.1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (sha256-pinned)
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          curl -sSfL -o "/tmp/${tarball}" "$url"
          echo "${GITLEAKS_SHA256}  /tmp/${tarball}" | sha256sum -c -
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan history
        run: /tmp/gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
