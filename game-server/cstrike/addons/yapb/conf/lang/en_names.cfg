;
; Configuration file contains English bot names.
;
; FreeNova curation (docs/SERVER-FEEL.md): the stock YaPB list ships 145 names
; from a 2003-era pool - several are stale ("Wigger Vampire", "pimpjuice",
; "peopleRpoop", "420", "vITTU"), and a few read like cheat bait, which is the
; worst possible first impression on a server that wants real players. This is
; a shorter list of clean, believable nicknames in the same register: nothing
; offensive, nothing that looks like an aimbot advert, nothing that pretends to
; be a community member.
;
; YaPB reads this file once at start (addons/yapb/conf/lang/<language>_names.cfg)
; and shuffles it; yb_language is "en", so this is the list the server uses.
; One name per line, max 31 characters, ';' starts a comment.
;
