name: plugins

# Compiles every AMXX plugin in the snapshot.
#
# tools/compile-plugins.sh picks its runner itself: it tries the bundled
# `scripting/amxxpc` (a 32-bit i386 ELF) natively, and falls back to
# `docker run i386/debian:bookworm-slim` when the native binary cannot execute.
# ubuntu-latest is x86_64 and does not restrict i386 syscalls, so the native path
# is the one expected to run here and the i386 userland is installed up front —
# that is the whole reason for the dpkg step. If the native binary ever stops
# executing on the runner, the script does not skip anything: it falls back to the
# container if that image has been pulled, and exits 3 with a message naming both
# runners if it has not. Either way the job fails loudly instead of passing on an
# empty plugin set. (On the snapshot host itself the native path is unavailable —
# seccomp kills i386 processes — which is why the docker fallback exists at all.)
#
# ALLOW_FAIL is empty by default now: the three sources that used to need a
# third-party-header exemption (bypass_guard, the ab_bypass bridge, the HTTP
# probe) build again because those 21 `.inc` files were recovered into
# scripting/include/ (SOURCES.md §7). The mechanism is still there for a source
# that genuinely cannot build from the tree — add it to KNOWN_UNBUILDABLE in the
# script and say why in SOURCES.md — but CI is expected to stay at
# `compiled: N  failed: 0  allowed-failures: 0`.
#
# Output goes to tools/build/plugins (gitignored); nothing is written into the
# live game-server tree.

on:
  push:
    branches: [main]
    paths:
      - 'game-server/cstrike/addons/amxmodx/scripting/**'
      - 'tools/compile-plugins.sh'
      - '.github/workflows/plugins.yml'
  pull_request:
  workflow_dispatch:
    branches: [main]
    paths:
      - 'game-server/cstrike/addons/amxmodx/scripting/**'
      - 'tools/compile-plugins.sh'
      - '.github/workflows/plugins.yml'

permissions:
  contents: read

concurrency:
  group: plugins-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: amxxpc
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the i386 runtime amxxpc needs
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libc6:i386 libstdc++6:i386 zlib1g:i386

      - name: Compile every plugin
        # The allowlist for the three sources that need third-party includes
        # that are not in this snapshot lives in the script itself, so CI and a
        # local run agree by default.
        run: ./tools/compile-plugins.sh
