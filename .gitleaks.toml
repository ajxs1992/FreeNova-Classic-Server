# gitleaks configuration for FreeNova-Classic-Server.
#
# Run by .github/workflows/secret-scan.yml as:
#   gitleaks git . --config .gitleaks.toml --redact --no-banner --verbose
#
# [extend] useDefault keeps every upstream rule (provider token formats, private
# key blocks, Discord webhook URLs, high-entropy generic assignments, ...).
#
# The allowlist below is a PATH allowlist, never a value allowlist, and it names
# only the files SECRETS.md already documents as part of this verbatim copy of
# two live hosts. Every entry carries an explicit note with the credential it
# holds and what has to happen before the repo is shared. A path allowlist is
# the only shape that is safe here: the goal is that a NEW secret anywhere else
# still fails the scan, so nothing in this file may be widened to a directory
# that a contributor could drop a fresh key into.
#
# Rule of thumb for reviewers: a pull request that adds a line to `paths` below
# is a pull request about secret handling, and needs the rotate/scrub decision
# from SECRETS.md — not just a green check.

[extend]
useDefault = true

[[allowlists]]
description = "Live snapshot paths documented in SECRETS.md. Rotate/scrub, do not copy."

# Regexes (RE2) matched against the repository-relative path of the finding, so
# they are anchored on both ends: '^web-panel/relay/relay.env$' does not cover
# 'web-panel/relay/relay.env.example' or anything a contributor adds next door.
paths = [
  # FNWEB_SECRET, SYNC_SECRET (the HMAC shared with the game server),
  # ADMIN_PASSWORD, REG_SECRET and a Discord webhook URL.
  # rotate: SECRETS.md checklist items 1, 3, 4 — then scrub.
  '^web-panel/relay/relay\.env$',

  # fnweb_secret + freenova_reg_server_secret — the same panel HMAC secrets, in
  # the plugin config. rotate: same new values as relay.env (items 1-2), then scrub.
  '^game-server/cstrike/addons/amxmodx/configs/amxx\.cfg$',

  # freenova_reg_server_secret (the registration-side shared secret).
  # rotate: with REG_SECRET (item 2), then scrub.
  '^game-server/cstrike/addons/amxmodx/configs/freenova_registration\.cfg$',

  # fn_admin_webhook — the Discord webhook URL for admin calls.
  # rotate: regenerate the URL in Discord and update both this and relay.env
  # (item 4), then scrub.
  '^game-server/cstrike/addons/amxmodx/configs/calladmin\.cfg$',

  # AMX Mod X admin accounts: names, SteamIDs, password hashes, access flags.
  # treat as personal data: no rotation makes the hashes safe — scrub, and
  # re-set the passwords on the host (item 5).
  '^game-server/cstrike/addons/amxmodx/configs/users\.ini$',
  '^game-server/cstrike/addons/amxmodx/configs/users\.ini\.bak-zgun$',

  # Commented-out rcon_password values left in the server config backups.
  # rotate: change rcon on the host, then scrub every backup.
  '^game-server/cstrike/server\.cfg\.bak-.*$',

  # The live server config. Note: SECRETS.md lists it as "freenova.cfg", and the
  # file actually lives at addons/amxmodx/configs/freenova.cfg — there is no
  # game-server/cstrike/freenova.cfg in this snapshot. Holds a commented-out
  # rcon_password. rotate + scrub with the server.cfg backups above.
  '^game-server/cstrike/addons/amxmodx/configs/freenova\.cfg$',

  # Test/dev secret literals used by the panel smoke suite. Not live
  # credentials, but they are literals of the same shape as the real ones and
  # the harness is meant to be readable. Do not "fix" it by inlining a real
  # value: the suite must keep using a throwaway.
  '^web-panel/test_harness\.mjs$',
  '^web-panel/src/top15/page\.js$',

  # Byte-identical copy of the same test literals, kept under the snapshot's
  # backup directory. Same reasoning as above; scrub together with
  # web-panel/test_harness.mjs when the tree is cleaned up.
  '^web-panel/_backup_20261011/test_harness\.mjs$',

  # Cloudflare database_id — an identifier, not a credential, but it is in
  # SECRETS.md's table and names a live resource.
  '^web-panel/wrangler\.toml$',

  # The live D1/SQLite replica and its write-ahead log: player rows with
  # SteamIDs, IPs, coins, XP and VIP state. Personal data — scrub, and rotate
  # whatever the rows expose (nothing here is a key, the data itself is the
  # problem).
  '^web-panel/data/freenova_panel\.sq3(-wal|-shm)?$',

  # bypass_guard IP / country allow and ban lists (iphub_api_keys.ini is empty).
  # Player-adjacent personal data; scrub together with the database above.
  '^game-server/cstrike/addons/amxmodx/configs/bypass_guard/[^/]+\.ini$',

  # Ranking, vault and user data written by the plugins at runtime.
  # Personal data written by the server itself; scrub before sharing.
  '^game-server/cstrike/addons/amxmodx/data/.*$',
]
